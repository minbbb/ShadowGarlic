# Server i2pd.
# Note: the file is mounted into the datadir as /home/i2pd/data/i2pd.conf.
# The image entrypoint runs i2pd with --datadir=/home/i2pd/data,
# so the config CANNOT be a uniquely named file elsewhere.

# Logs to stdout (visible via `docker compose logs i2pd`).
log = stdout
loglevel = info

ipv4 = true
ipv6 = false

# Default transports: NTCP2 and SSU2 are enabled.

# We do not use the standard client services, disable them.
[socksproxy]
enabled = false

[httpproxy]
enabled = false

[sam]
enabled = false

# Webconsole: needed only to view the b32 address of the server tunnel
# on the "I2P tunnels" page. Access is restricted by Basic Auth - the password
# is passed via the --http.pass CLI arg in the container entrypoint (see
# docker-compose.yml); i2pd.conf itself is not templated.
[http]
enabled = true
auth = true
address = 0.0.0.0
port = 7070

# Do not accept transit (foreign relay) tunnels - the server is used
# only as a Shadowsocks bridge, not as a relay node of the I2P network.
notransit = true