# Client i2pd (for docker-compose.client.yml).
# Mounted as /home/i2pd/data/i2pd.conf (see the note in config/i2pd.conf).

log = stdout
loglevel = info

ipv4 = true
ipv6 = false

# Do not accept transit (foreign relay) tunnels - the client is used
# only as a Shadowsocks client, not as a relay node of the I2P network.
notransit = true

# All standard client services are not needed - sslocal connects
# directly to the client tunnel (see client/tunnels.conf).
[socksproxy]
enabled = false

[httpproxy]
enabled = false

[sam]
enabled = false

# Webconsole is not published to the host on the client (you can open it via
# `docker compose -f docker-compose.client.yml exec i2pd wget -qO- http://127.0.0.1:7070/`).
# Access is restricted by Basic Auth - the password is passed via the
# --http.pass CLI arg in the container entrypoint (see docker-compose.client.yml).
[http]
enabled = true
auth = true
address = 0.0.0.0
port = 7070